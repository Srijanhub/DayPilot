<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      background: #090d16;
      color: #e2e8f0;
      font-size: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .title {
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #38bdf8;
      text-transform: uppercase;
    }
    .status-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #0369a1;
      color: #fff;
    }
    .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      color: #94a3b8;
    }
    .row strong {
      color: #f1f5f9;
    }
    button {
      width: 100%;
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #334155;
      padding: 8px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background: #334155;
    }
    .notice {
      font-size: 10px;
      color: #64748b;
      margin-top: 12px;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">DAYPILOT HUD</div>
    <div id="statusDot" class="status-badge">ONLINE</div>
  </div>
  <div class="row">
    <span>Active Mode:</span>
    <strong id="modeDisplay">SYNCING...</strong>
  </div>
  <div class="row">
    <span>Telemetry:</span>
    <strong id="trackingState">ACTIVE</strong>
  </div>
  <button id="togglePauseBtn">PAUSE TRACKING</button>
  <div class="notice">
    Strict Privacy: Incognito tabs and banking sites are never logged.
  </div>

  <script src="popup.js"></script>
</body>
</html>
